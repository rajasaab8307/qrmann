<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#ffffff">
<meta name="description" content="Mann Industries UPI payment QR generator">
<title>Mann Industries · UPI QR</title>
<script>
  /* Apply saved theme before first paint (default: light) */
  (function () {
    var t = "light";
    try { t = localStorage.getItem("mann_theme_v2") || "light"; } catch (e) {}
    document.documentElement.setAttribute("data-theme", t);
  })();
</script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
<style>
/* =========================================================
   1. Design tokens
   ========================================================= */
:root{
  color-scheme:light;
  --red:#ea4335; --yellow:#fbbc04; --green:#34a853;
  --ease:cubic-bezier(.2,.8,.2,1);

  --page:#eef2f9;
  --page-wide:linear-gradient(160deg,#e8f0fe 0%,#f1f3f4 55%,#fef7e0 100%);
  --surface:#fff; --surface-2:#fff; --glass:rgba(255,255,255,.8);
  --ink:#202124; --muted:#5f6368; --line:#e8eaed;
  --blue:#1a73e8; --blue-soft:#e8f0fe; --blue-soft-2:#d2e3fc;
  --btn:#1a73e8; --btn-hover:#1765cc; --btn-off:#a8c7fa; --tag:#0b2a5b;
  --ph:#c4c7cc; --ph-bg:#f8f9fa;
  --blob-1:#c6dafc; --blob-2:#fde7a8;
  --shadow:rgba(60,64,67,.1); --glow:rgba(26,115,232,.22); --app-shadow:rgba(32,33,36,.16);
  --toast-bg:#323232; --toast-ink:#fff;

  /* QR size: fits the viewport so the page never scrolls */
  --chrome:560px;
  --qr:clamp(130px,min(74vw,calc(100dvh - var(--chrome))),300px);
}
[data-theme="dark"]{
  color-scheme:dark;
  --page:#070a10;
  --page-wide:linear-gradient(160deg,#0b1424 0%,#070a10 55%,#14110a 100%);
  --surface:#10151f; --surface-2:#171e2b; --glass:rgba(16,21,31,.82);
  --ink:#e8eaed; --muted:#9aa0a6; --line:#273042;
  --blue:#8ab4f8; --blue-soft:rgba(138,180,248,.14); --blue-soft-2:rgba(138,180,248,.26);
  --btn:#1a73e8; --btn-hover:#3b82f0; --btn-off:#233a60; --tag:#8ab4f8;
  --ph:#4a5163; --ph-bg:#0d121b;
  --blob-1:rgba(26,115,232,.35); --blob-2:rgba(251,188,4,.10);
  --shadow:rgba(0,0,0,.45); --glow:rgba(26,115,232,.45); --app-shadow:rgba(0,0,0,.6);
  --toast-bg:#e8eaed; --toast-ink:#202124;
}
@media (max-height:720px){:root{--chrome:440px}}
@media (max-height:600px){:root{--chrome:390px}}

/* =========================================================
   2. Base
   ========================================================= */
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;overscroll-behavior:none}
body{
  font-family:"Google Sans","Product Sans",Roboto,"Segoe UI",system-ui,sans-serif;
  color:var(--ink);background:var(--page);
  display:flex;justify-content:center;align-items:center;
  -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--blue);outline-offset:2px}

/* =========================================================
   3. App shell
   ========================================================= */
.app{
  position:relative;isolation:isolate;overflow:hidden;
  width:100%;max-width:480px;height:100vh;height:100dvh;
  display:flex;flex-direction:column;background:var(--surface);
}
.app::before,.app::after{content:"";position:absolute;z-index:-1;border-radius:50%;filter:blur(60px);opacity:.55;pointer-events:none}
.app::before{width:300px;height:300px;top:-110px;right:-90px;background:radial-gradient(circle,var(--blob-1),transparent 70%);animation:drift 14s ease-in-out infinite alternate}
.app::after{width:260px;height:260px;bottom:-100px;left:-80px;background:radial-gradient(circle,var(--blob-2),transparent 70%);animation:drift 18s ease-in-out infinite alternate-reverse}

header{
  flex:none;display:flex;align-items:center;gap:12px;
  padding:calc(12px + env(safe-area-inset-top,0px)) 20px 12px;
  background:var(--glass);backdrop-filter:blur(10px);border-bottom:1px solid var(--line);
}
.logo{position:relative;overflow:hidden;flex:none;width:40px;height:40px;border-radius:12px;display:grid;place-items:center;
  background:linear-gradient(135deg,#0b2a5b,#1a73e8);color:#fff;font-weight:700;font-size:21px;animation:glow 3s ease-in-out infinite}
.logo::after{content:"";position:absolute;top:0;left:-70%;width:40%;height:100%;transform:skewX(-20deg);
  background:linear-gradient(100deg,transparent,rgba(255,255,255,.6),transparent);animation:shine 5s ease-in-out infinite}
.brand{flex:1;min-width:0}
.brand b{display:block;font-size:16px;line-height:1.2}
.brand span{font-size:12px;color:var(--muted)}
.gdots{display:flex;gap:5px}
.gdots i{width:8px;height:8px;border-radius:50%;animation:wave 1.8s ease-in-out infinite}
.gdots i:nth-child(2){animation-delay:.15s}.gdots i:nth-child(3){animation-delay:.3s}.gdots i:nth-child(4){animation-delay:.45s}

.theme{position:relative;flex:none;width:38px;height:38px;margin-left:10px;border:none;border-radius:50%;overflow:hidden;cursor:pointer;
  display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);transition:transform .3s var(--ease)}
.theme:hover{transform:rotate(18deg)}
.theme:active{transform:scale(.92)}
.theme svg{position:absolute;width:20px;height:20px;transition:transform .5s var(--ease),opacity .3s}
:root:not([data-theme="dark"]) .sun,[data-theme="dark"] .moon{opacity:0;transform:rotate(90deg) scale(.4)}

.layout{
  flex:1;min-height:0;display:flex;flex-direction:column;justify-content:space-between;gap:12px;
  padding:14px 20px calc(14px + env(safe-area-inset-bottom,0px));
}
.panel,.qr-col{display:flex;flex-direction:column;gap:12px;min-height:0}
.qr-col{flex:1;justify-content:space-between;perspective:900px}

/* =========================================================
   4. Payee + amount
   ========================================================= */
.pay-to{display:flex;align-items:center;gap:12px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--surface-2)}
.avatar{flex:none;width:38px;height:38px;border-radius:50%;display:grid;place-items:center;background:var(--blue-soft);color:var(--blue);font-weight:700;text-transform:uppercase}
.pay-to small{display:block;font-size:11.5px;color:var(--muted)}
.pay-to b{font-size:15px;text-transform:capitalize}
.verified{margin-left:auto;display:flex;align-items:center;gap:4px;font-size:11.5px;font-weight:500;color:var(--green)}
.verified svg{width:15px;height:15px}

.amount-box{text-align:center}
.amount-box label{display:block;font-size:12.5px;color:var(--muted)}
.amount-row{display:flex;justify-content:center;align-items:center;gap:6px}
.amount-row span{font-size:clamp(28px,7vw,38px);color:var(--muted)}
.amount-row input{
  width:70%;max-width:280px;min-width:0;border:none;outline:none;background:transparent;
  font-family:inherit;font-size:clamp(40px,12vw,56px);font-weight:500;color:var(--ink);text-align:left;caret-color:var(--blue);
}
.amount-row input::placeholder{color:var(--ph)}
.underline{width:90px;height:2px;margin:0 auto;border-radius:2px;background:var(--line);transition:width .35s var(--ease),background .25s}
.amount-box:focus-within .underline{width:min(220px,60%);background:var(--blue)}

/* =========================================================
   5. QR card
   ========================================================= */
.qr-card{
  flex:1;min-height:0;display:flex;flex-direction:column;align-items:center;justify-content:center;
  padding:14px;border:1px solid var(--line);border-radius:24px;text-align:center;
  background:var(--surface-2);box-shadow:0 2px 14px var(--shadow);
  transition:box-shadow .4s,rotate .35s var(--ease);
}
.qr-card.live{box-shadow:0 6px 28px var(--glow)}
.tag{margin-bottom:10px;font-size:12.5px;font-weight:600;color:var(--tag)}

.qr-host{position:relative;flex:none;width:var(--qr);height:var(--qr)}
.qr-wrap{position:relative;width:100%;height:100%;overflow:hidden;border-radius:14px;background:#fff;transition:box-shadow .4s}
.qr-wrap.ready{box-shadow:0 0 0 8px #fff}   /* quiet zone so the QR also scans in dark mode */
#qrCanvas{display:block;width:100%;height:100%;opacity:0;transform:scale(.9);filter:blur(6px);
  transition:opacity .45s var(--ease),transform .5s var(--ease),filter .45s var(--ease)}
.qr-wrap.ready #qrCanvas{opacity:1;transform:none;filter:none}
.qr-wrap.reveal #qrCanvas{animation:iris .85s var(--ease)}
.qr-wrap.tick #qrCanvas{animation:tick .3s var(--ease)}
.qr-wrap::after{content:"";position:absolute;left:0;right:0;top:-30%;height:30%;opacity:0;pointer-events:none;
  background:linear-gradient(180deg,transparent,rgba(26,115,232,.35),transparent)}
.qr-wrap.reveal::after{animation:scan .9s ease-in-out}
.ring{position:absolute;inset:0;border-radius:20px;border:2px solid var(--blue);opacity:0;pointer-events:none}
.qr-wrap.reveal + .ring{animation:ring .95s ease-out}
.qr-wrap.tick + .ring{animation:ring .5s ease-out}

.placeholder{
  position:absolute;inset:0;display:flex;flex-direction:column;gap:10px;align-items:center;justify-content:center;
  padding:16px;border-radius:14px;color:var(--muted);font-size:13px;line-height:1.4;
  background:
    linear-gradient(var(--blue),var(--blue)) top left/22px 3px no-repeat,    linear-gradient(var(--blue),var(--blue)) top left/3px 22px no-repeat,
    linear-gradient(var(--blue),var(--blue)) top right/22px 3px no-repeat,   linear-gradient(var(--blue),var(--blue)) top right/3px 22px no-repeat,
    linear-gradient(var(--blue),var(--blue)) bottom left/22px 3px no-repeat, linear-gradient(var(--blue),var(--blue)) bottom left/3px 22px no-repeat,
    linear-gradient(var(--blue),var(--blue)) bottom right/22px 3px no-repeat,linear-gradient(var(--blue),var(--blue)) bottom right/3px 22px no-repeat,
    var(--ph-bg);
  animation:breathe 2.2s ease-in-out infinite;
}
.placeholder svg{width:34px;height:34px;color:var(--blue);animation:float 2.2s ease-in-out infinite}
.placeholder.bad{color:var(--red)}
.qr-wrap.ready .placeholder{display:none}

.total{margin-top:10px}
.total small{display:block;font-size:11.5px;color:var(--muted)}
.total b{display:inline-flex;height:1.2em;overflow:hidden;vertical-align:bottom;
  font-size:clamp(26px,7vw,32px);font-weight:600;line-height:1.2;letter-spacing:-.3px;font-variant-numeric:tabular-nums}
.total b.bump{animation:bump .35s var(--ease)}
.dg{display:inline-block;height:1.2em;overflow:hidden}
.col{display:flex;flex-direction:column;transition:transform .8s cubic-bezier(.2,.9,.25,1)}
.col span{display:block;height:1.2em;line-height:1.2em;text-align:center}
.sym{display:inline-block;height:1.2em;line-height:1.2em}
.chin{animation:chin .5s var(--ease)}
.hint{margin-top:4px;font-size:11.5px;color:var(--muted)}

/* =========================================================
   6. Actions, toast, footer
   ========================================================= */
.actions{flex:none;display:flex;gap:10px}
.btn{
  position:relative;overflow:hidden;flex:1;min-height:44px;padding:12px 8px;
  display:flex;align-items:center;justify-content:center;gap:7px;
  border:none;border-radius:999px;cursor:pointer;
  background:var(--blue-soft);color:var(--blue);font-size:14px;font-weight:500;
  transition:background .2s,transform .15s,box-shadow .2s,opacity .2s;
}
.btn svg{flex:none;width:18px;height:18px}
.btn:hover:not(:disabled){background:var(--blue-soft-2);transform:translateY(-2px)}
.btn:active:not(:disabled){transform:scale(.96)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.primary{background:var(--btn);color:#fff}
.btn.primary:hover:not(:disabled){background:var(--btn-hover);box-shadow:0 6px 16px rgba(26,115,232,.4)}
.btn.primary:disabled{background:var(--btn-off);opacity:1}
.btn.ok{background:var(--green)!important;color:#fff!important;box-shadow:0 6px 16px rgba(52,168,83,.4)}
.btn.ok svg{animation:pop .5s var(--ease)}
.ripple{position:absolute;border-radius:50%;background:currentColor;opacity:.25;transform:scale(0);pointer-events:none;animation:ripple .6s ease-out forwards}

footer{flex:none;text-align:center;font-size:11px;color:var(--muted)}

#toast{
  position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));z-index:20;
  padding:10px 18px;border-radius:10px;white-space:nowrap;font-size:14px;
  background:var(--toast-bg);color:var(--toast-ink);
  opacity:0;pointer-events:none;transform:translate(-50%,24px) scale(.95);transition:.3s var(--ease);
}
#toast.show{opacity:1;transform:translate(-50%,0)}

/* entrance */
.rise{opacity:0;animation:rise .6s var(--ease) forwards}
.d1{animation-delay:.05s}.d2{animation-delay:.15s}.d3{animation-delay:.25s}.d4{animation-delay:.35s}

/* theme switch (View Transitions API) */
::view-transition-old(root),::view-transition-new(root){animation:none;mix-blend-mode:normal}
::view-transition-old(root){z-index:1}
::view-transition-new(root){z-index:2}
html.theme-anim *,html.theme-anim *::before,html.theme-anim *::after{transition:background-color .45s,color .45s,border-color .45s,box-shadow .45s!important}

/* =========================================================
   7. Keyframes
   ========================================================= */
@keyframes rise{from{opacity:0;transform:translateY(18px)}to{opacity:1;transform:none}}
@keyframes drift{to{transform:translate(-40px,50px) scale(1.15)}}
@keyframes glow{0%,100%{box-shadow:0 2px 6px rgba(26,115,232,.3)}50%{box-shadow:0 2px 16px rgba(26,115,232,.6)}}
@keyframes shine{0%,65%{left:-70%}100%{left:140%}}
@keyframes wave{0%,60%,100%{transform:translateY(0)}30%{transform:translateY(-5px)}}
@keyframes breathe{50%{background-size:30px 3px,3px 30px,30px 3px,3px 30px,30px 3px,3px 30px,30px 3px,3px 30px,auto}}
@keyframes float{50%{transform:translateY(-5px)}}
@keyframes iris{from{clip-path:circle(0% at 50% 50%)}to{clip-path:circle(80% at 50% 50%)}}
@keyframes tick{50%{transform:scale(.97)}}
@keyframes scan{0%{top:-30%;opacity:1}100%{top:100%;opacity:1}}
@keyframes ring{0%{opacity:.8;transform:scale(1)}100%{opacity:0;transform:scale(1.32)}}
@keyframes bump{40%{transform:scale(1.08);color:var(--blue)}}
@keyframes chin{from{opacity:0;transform:scale(.5)}}
@keyframes pop{40%{transform:scale(1.5) rotate(-12deg)}}
@keyframes ripple{to{transform:scale(1);opacity:0}}

/* =========================================================
   8. Responsive
   ========================================================= */
@media (max-width:380px){
  .gdots{display:none}
  .btn svg{display:none}
}
@media (max-height:720px){
  .tag,.hint,footer,.verified{display:none}
  header{padding-top:calc(8px + env(safe-area-inset-top,0px));padding-bottom:8px}
  .logo{width:34px;height:34px;font-size:18px}
  .layout{gap:8px;padding-top:10px;padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  .panel,.qr-col{gap:8px}
  .qr-card{padding:10px}
  .total{margin-top:6px}
  .amount-row input{font-size:clamp(34px,10vw,46px)}
}
@media (max-height:560px){.pay-to small{display:none}.pay-to{padding:6px 12px}}

/* tablet / desktop / phone landscape: two columns */
@media (min-width:720px),(orientation:landscape) and (max-height:520px){
  :root{--qr:clamp(140px,calc(100dvh - 400px),300px)}
  body{background:var(--page-wide)}
  .app{max-width:980px;height:min(640px,calc(100dvh - 40px));border-radius:28px;box-shadow:0 14px 50px var(--app-shadow)}
  header{padding:18px 32px}
  .layout{flex-direction:row;align-items:stretch;justify-content:stretch;gap:32px;padding:28px 32px}
  .panel{flex:1 1 50%;justify-content:center;gap:22px}
  .qr-col{flex:1 1 50%;justify-content:center;gap:16px}
  .qr-card{flex:none;padding:22px}
  .tag,.hint{display:block}
  .verified{display:flex}
  footer{display:block}
  .pay-to{padding:14px 16px}.pay-to small{display:block}
  .avatar{width:44px;height:44px}
  .amount-row input{font-size:60px}
}
@media (min-width:720px) and (max-height:620px){
  :root{--qr:clamp(120px,calc(100dvh - 330px),300px)}
  .tag,.hint,footer{display:none}
  .app{height:calc(100dvh - 20px)}
  .layout{padding:18px 28px}
}
@media (orientation:landscape) and (max-height:520px) and (max-width:719px){
  :root{--qr:clamp(110px,calc(100dvh - 190px),240px)}
  .app{max-width:none;height:100dvh;border-radius:0}
  .tag,.hint,footer,.verified{display:none}
  .layout{padding:10px 20px;gap:18px}
  header{padding:8px 20px}
}
@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation-duration:.01ms!important;animation-iteration-count:1!important;transition-duration:.01ms!important}
}
</style>
</head>
<body>
<div class="app">
  <header class="rise">
    <div class="logo" aria-hidden="true">M</div>
    <div class="brand"><b>Mann Industries</b><span>UPI Payment QR</span></div>
    <div class="gdots" aria-hidden="true"><i style="background:var(--blue)"></i><i style="background:var(--red)"></i><i style="background:var(--yellow)"></i><i style="background:var(--green)"></i></div>
    <button class="theme" id="theme" type="button" aria-label="Switch theme" title="Switch theme">
      <svg class="sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="4"/><path d="M12 2v2M12 20v2M4.9 4.9l1.4 1.4M17.7 17.7l1.4 1.4M2 12h2M20 12h2M4.9 19.1l1.4-1.4M17.7 6.3l1.4-1.4"/></svg>
      <svg class="moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.8A9 9 0 1 1 11.2 3 7 7 0 0 0 21 12.8z"/></svg>
    </button>
  </header>

  <main class="layout">
    <section class="panel">
      <div class="pay-to rise d1">
        <div class="avatar" id="avatar" aria-hidden="true"></div>
        <div><small>Paying to</small><b id="payee"></b></div>
        <div class="verified"><svg viewBox="0 0 24 24" fill="currentColor"><path d="M12 1 3 5v6c0 5.5 3.8 10.7 9 12 5.2-1.3 9-6.5 9-12V5l-9-4zm-1.2 15L7 12.2l1.4-1.4 2.4 2.4 5-5 1.4 1.4-6.4 6.4z"/></svg>Secure</div>
      </div>

      <div class="amount-box rise d2">
        <label for="amount">Enter amount</label>
        <div class="amount-row">
          <span aria-hidden="true">₹</span>
          <input id="amount" type="text" inputmode="decimal" enterkeyhint="done" autocomplete="off" placeholder="0" maxlength="10" autofocus>
        </div>
        <div class="underline"></div>
      </div>
    </section>

    <section class="qr-col">
      <div class="qr-card rise d3" id="card">
        <div class="tag">Scan with any UPI app</div>
        <div class="qr-host">
          <div class="qr-wrap" id="qrWrap">
            <canvas id="qrCanvas" width="560" height="560" role="img" aria-label="UPI payment QR code"></canvas>
            <div class="placeholder" id="placeholder">
              <svg viewBox="0 0 24 24" fill="currentColor" aria-hidden="true"><path d="M3 11h8V3H3v8zm2-6h4v4H5V5zm8-2v8h8V3h-8zm6 6h-4V5h4v4zM3 21h8v-8H3v8zm2-6h4v4H5v-4zm13-2h-2v3h-3v2h3v3h2v-3h3v-2h-3v-3z"/></svg>
              <span id="phText"></span>
            </div>
          </div>
          <i class="ring"></i>
        </div>
        <div class="total"><small>Total amount</small><b id="total" aria-live="polite">₹0.00</b></div>
        <div class="hint">Google Pay · PhonePe · Paytm · BHIM</div>
      </div>

      <div class="actions rise d4">
        <button class="btn primary" id="dl" type="button" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M19 9h-4V3H9v6H5l7 7 7-7zM5 18v2h14v-2H5z"/></svg><span>Download</span></button>
        <button class="btn" id="copy" type="button" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M16 1H4c-1.1 0-2 .9-2 2v14h2V3h12V1zm3 4H8c-1.1 0-2 .9-2 2v14c0 1.1.9 2 2 2h11c1.1 0 2-.9 2-2V7c0-1.1-.9-2-2-2zm0 16H8V7h11v14z"/></svg><span>Copy</span></button>
        <button class="btn" id="share" type="button" disabled><svg viewBox="0 0 24 24" fill="currentColor"><path d="M18 16.08c-.76 0-1.44.3-1.96.77L8.91 12.7c.05-.23.09-.46.09-.7s-.04-.47-.09-.7l7.05-4.11c.54.5 1.25.81 2.04.81 1.66 0 3-1.34 3-3s-1.34-3-3-3-3 1.34-3 3c0 .24.04.47.09.7L8.04 9.81C7.5 9.31 6.79 9 6 9c-1.66 0-3 1.34-3 3s1.34 3 3 3c.79 0 1.5-.31 2.04-.81l7.12 4.16c-.05.21-.08.43-.08.65 0 1.61 1.31 2.92 2.92 2.92s2.92-1.31 2.92-2.92-1.31-2.92-2.92-2.92z"/></svg><span>Share</span></button>
      </div>
      <footer>© Mann Industries · Secured by UPI</footer>
    </section>
  </main>
</div>
<div id="toast" role="status"></div>

<script>
(() => {
  "use strict";

  /* ======================= CONFIG ======================= */
  const CONFIG = Object.freeze({
    upiId:       "sololeveling8055@okicici",
    payeeName:   "jashanpreet singh",
    aid:         "uGICAgODi8rSQDg",
    feePercent:  0.85,      // added on top of the entered amount
    maxTotal:    100000,    // largest payment the QR will be generated for (₹)
    qrSize:      560,       // internal canvas resolution
    debounceMs:  120,
  });

  /* ======================= HELPERS ======================= */
  const $ = id => document.getElementById(id);
  const reduceMotion = matchMedia("(prefers-reduced-motion: reduce)").matches;
  const restart = (node, cls) => { node.classList.remove(cls); void node.offsetWidth; node.classList.add(cls); };

  const inr = new Intl.NumberFormat("en-IN", { style: "currency", currency: "INR", minimumFractionDigits: 2, maximumFractionDigits: 2 });
  const money = n => inr.format(n).replace(/\s/g, "");

  /** amount + fee, calculated in paise to avoid floating-point drift */
  const withFee = amount => {
    const paise = Math.round(amount * 100);
    return (paise + Math.round(paise * CONFIG.feePercent / 100)) / 100;
  };

  /** keep digits and one dot, max two decimals, no leading zeros */
  const sanitize = raw => {
    let v = raw.replace(/[^\d.]/g, "");
    const dot = v.indexOf(".");
    if (dot !== -1) v = v.slice(0, dot + 1) + v.slice(dot + 1).replace(/\./g, "").slice(0, 2);
    return v.replace(/^0+(?=\d)/, "");
  };

  const buildLink = total =>
    "upi://pay?pa=" + CONFIG.upiId +
    "&pn=" + encodeURIComponent(CONFIG.payeeName) +
    "&aid=" + CONFIG.aid +
    "&am=" + total.toFixed(2) +
    "&cu=INR";

  /* ======================= ELEMENTS ======================= */
  const ui = {
    amount: $("amount"), total: $("total"), card: $("card"),
    wrap: $("qrWrap"), canvas: $("qrCanvas"),
    placeholder: $("placeholder"), phText: $("phText"),
    dl: $("dl"), copy: $("copy"), share: $("share"), toastEl: $("toast"),
  };
  const actions = [ui.dl, ui.copy, ui.share];

  $("payee").textContent  = CONFIG.payeeName;
  $("avatar").textContent = CONFIG.payeeName.trim()[0] || "M";

  /* ======================= TOAST + BUTTON FEEDBACK ======================= */
  let toastTimer;
  function toast(message) {
    ui.toastEl.textContent = message;
    ui.toastEl.classList.add("show");
    clearTimeout(toastTimer);
    toastTimer = setTimeout(() => ui.toastEl.classList.remove("show"), 1800);
  }
  function flash(btn, text) {
    const label = btn.querySelector("span:not(.ripple)");
    if (!label.dataset.original) label.dataset.original = label.textContent;
    label.textContent = text;
    btn.classList.add("ok");
    clearTimeout(btn._timer);
    btn._timer = setTimeout(() => { label.textContent = label.dataset.original; btn.classList.remove("ok"); }, 1400);
  }

  /* ======================= ODOMETER (animated total) ======================= */
  const odometer = (() => {
    let current = "";
    const buildDigit = () => {
      const digit = document.createElement("span"); digit.className = "dg chin";
      const col = document.createElement("span");   col.className = "col";
      for (let n = 0; n < 10; n++) { const s = document.createElement("span"); s.textContent = n; col.appendChild(s); }
      digit.appendChild(col);
      return digit;
    };
    const roll = text => [...text].forEach((ch, i) => {
      const node = ui.total.children[i];
      if (/\d/.test(ch) && node && node.firstChild) node.firstChild.style.transform = `translateY(-${Number(ch) * 1.2}em)`;
    });
    return {
      set(value) {
        const text = money(value);
        ui.total.setAttribute("aria-label", text);
        if (current.length !== text.length) {
          ui.total.replaceChildren(...[...text].map(ch => {
            if (/\d/.test(ch)) return buildDigit();
            const sym = document.createElement("span"); sym.className = "sym"; sym.textContent = ch; return sym;
          }));
          requestAnimationFrame(() => requestAnimationFrame(() => roll(text)));
        } else roll(text);
        current = text;
        restart(ui.total, "bump");
      },
      get text() { return current; },
    };
  })();

  /* ======================= QR RENDERER ======================= */
  const qr = (() => {
    const S = CONFIG.qrSize, ctx = ui.canvas.getContext("2d");
    let instance, host;

    const roundRect = (x, y, w, h, r) => {
      ctx.beginPath();
      if (ctx.roundRect) return ctx.roundRect(x, y, w, h, r);
      ctx.moveTo(x + r, y); ctx.arcTo(x + w, y, x + w, y + h, r); ctx.arcTo(x + w, y + h, x, y + h, r);
      ctx.arcTo(x, y + h, x, y, r); ctx.arcTo(x, y, x + w, y, r); ctx.closePath();
    };

    const drawBadge = () => {
      const size = 96, x = (S - size) / 2;
      ctx.fillStyle = "#fff"; roundRect(x - 8, x - 8, size + 16, size + 16, 22); ctx.fill();
      const g = ctx.createLinearGradient(x, x, x + size, x + size);
      g.addColorStop(0, "#0b2a5b"); g.addColorStop(1, "#1a73e8");
      ctx.fillStyle = g; roundRect(x, x, size, size, 18); ctx.fill();
      ctx.fillStyle = "#fff"; ctx.font = "700 62px Roboto, Arial, sans-serif";
      ctx.textAlign = "center"; ctx.textBaseline = "middle"; ctx.fillText("M", S / 2, S / 2 + 4);
    };

    return {
      draw(text) {
        if (typeof QRCode === "undefined") throw new Error("QR library not loaded");
        const options = { text, width: S, height: S, correctLevel: QRCode.CorrectLevel.H, colorDark: "#0b2a5b", colorLight: "#ffffff" };
        if (!instance) { host = document.createElement("div"); instance = new QRCode(host, options); }
        else instance.makeCode(text);
        const source = host.querySelector("canvas");
        if (!source) throw new Error("QR canvas unavailable");
        ctx.fillStyle = "#fff"; ctx.fillRect(0, 0, S, S);
        ctx.drawImage(source, 0, 0, S, S);
        drawBadge();
      },
    };
  })();

  /* ======================= STATE + UPDATE ======================= */
  const state = { link: "", total: 0 };
  let debounceTimer;

  function showPlaceholder(message, isError = false) {
    ui.phText.textContent = message;
    ui.placeholder.classList.toggle("bad", isError);
  }
  function reset(message, isError) {
    clearTimeout(debounceTimer);
    state.link = ""; state.total = 0;
    odometer.set(0);
    ui.wrap.classList.remove("ready", "reveal", "tick");
    ui.card.classList.remove("live");
    actions.forEach(b => b.disabled = true);
    showPlaceholder(message, isError);
  }
  function render() {
    try { qr.draw(state.link); }
    catch (err) { return reset("Could not create the QR. Check your internet connection and reload.", true); }
    const first = !ui.wrap.classList.contains("ready");
    ui.wrap.classList.add("ready");
    ui.card.classList.add("live");
    ui.wrap.classList.remove("reveal", "tick");
    restart(ui.wrap, first ? "reveal" : "tick");
    actions.forEach(b => b.disabled = false);
  }
  function update() {
    const amount = parseFloat(ui.amount.value);
    if (!(amount > 0)) return reset("Enter an amount to generate QR");
    const total = withFee(amount);
    if (total > CONFIG.maxTotal) return reset(`Maximum ${money(CONFIG.maxTotal)} per payment`, true);
    state.total = total;
    state.link  = buildLink(total);
    odometer.set(total);
    clearTimeout(debounceTimer);
    debounceTimer = setTimeout(render, CONFIG.debounceMs);
  }

  ui.amount.addEventListener("input", () => {
    const clean = sanitize(ui.amount.value);
    if (clean !== ui.amount.value) ui.amount.value = clean;
    update();
  });
  ui.amount.addEventListener("keydown", e => {
    if (e.key === "Enter" && !ui.dl.disabled) ui.dl.click();
    if (e.key === "Escape") { ui.amount.value = ""; update(); }
  });

  /* ======================= ACTIONS ======================= */
  const fileName = () => `Mann-UPI-QR-${state.total.toFixed(2)}.png`;
  const canvasBlob = () => new Promise(res => ui.canvas.toBlob(res, "image/png"));

  async function copyText(text) {
    try { await navigator.clipboard.writeText(text); return true; }
    catch {
      const ta = Object.assign(document.createElement("textarea"), { value: text });
      ta.style.cssText = "position:fixed;opacity:0"; document.body.appendChild(ta); ta.select();
      let ok = false; try { ok = document.execCommand("copy"); } catch {}
      ta.remove(); return ok;
    }
  }

  ui.dl.onclick = async () => {
    const blob = await canvasBlob(); if (!blob) return toast("Could not save the image");
    const url = URL.createObjectURL(blob);
    Object.assign(document.createElement("a"), { href: url, download: fileName() }).click();
    setTimeout(() => URL.revokeObjectURL(url), 2000);
    flash(ui.dl, "Saved ✓");
  };
  ui.copy.onclick = async () => (await copyText(state.link)) ? flash(ui.copy, "Copied ✓") : toast("Copy not supported");
  ui.share.onclick = async () => {
    const blob = await canvasBlob(); if (!blob) return;
    const file  = new File([blob], fileName(), { type: "image/png" });
    const title = "Mann Industries UPI QR";
    try {
      if (navigator.canShare && navigator.canShare({ files: [file] })) await navigator.share({ files: [file], title, text: odometer.text });
      else if (navigator.share) await navigator.share({ title, text: state.link });
      else toast("Sharing not supported");
    } catch { /* user cancelled */ }
  };

  /* ripple on buttons */
  document.querySelectorAll(".btn").forEach(btn => btn.addEventListener("pointerdown", e => {
    if (btn.disabled) return;
    const r = btn.getBoundingClientRect(), d = Math.max(r.width, r.height) * 2, dot = document.createElement("span");
    dot.className = "ripple";
    dot.style.cssText = `width:${d}px;height:${d}px;left:${e.clientX - r.left - d / 2}px;top:${e.clientY - r.top - d / 2}px`;
    btn.appendChild(dot); setTimeout(() => dot.remove(), 600);
  }));

  /* ======================= THEME ======================= */
  const root = document.documentElement;
  const applyTheme = t => {
    root.setAttribute("data-theme", t);
    document.querySelector('meta[name="theme-color"]').setAttribute("content", t === "dark" ? "#10151f" : "#ffffff");
  };
  applyTheme(root.getAttribute("data-theme") || "light");

  $("theme").onclick = e => {
    const next = root.getAttribute("data-theme") === "dark" ? "light" : "dark";
    const change = () => { applyTheme(next); try { localStorage.setItem("mann_theme_v2", next); } catch {} };
    if (document.startViewTransition && !reduceMotion) {
      const r = e.currentTarget.getBoundingClientRect(), x = r.left + r.width / 2, y = r.top + r.height / 2;
      const end = Math.hypot(Math.max(x, innerWidth - x), Math.max(y, innerHeight - y));
      document.startViewTransition(change).ready.then(() => root.animate(
        { clipPath: [`circle(0px at ${x}px ${y}px)`, `circle(${end}px at ${x}px ${y}px)`] },
        { duration: 700, easing: "cubic-bezier(.2,.8,.2,1)", pseudoElement: "::view-transition-new(root)" }
      ));
    } else {
      root.classList.add("theme-anim"); change();
      setTimeout(() => root.classList.remove("theme-anim"), 500);
    }
  };

  /* ======================= CARD TILT (mouse only) ======================= */
  if (matchMedia("(hover:hover)").matches && !reduceMotion) {
    ui.card.addEventListener("pointermove", e => {
      const r = ui.card.getBoundingClientRect();
      const nx = (e.clientX - r.left) / r.width - .5, ny = (e.clientY - r.top) / r.height - .5;
      ui.card.style.rotate = `${-ny} ${nx} 0 ${Math.hypot(nx, ny) * 14}deg`;
    });
    ui.card.addEventListener("pointerleave", () => { ui.card.style.rotate = "none"; });
  }

  /* ======================= INIT ======================= */
  update();
})();
</script>
</body>
</html>
